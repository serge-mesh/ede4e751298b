[workspace]
resolver = "3"
members = [
    "crates/picket-wire",
    "crates/picket-rules",
    "crates/picket-bundle",
    "crates/picket-lookup",
    "crates/picket-api",
    "apps/picket-edge",
    "apps/picket-edge-helper",
    "apps/picket-edge-update",
    "apps/picket-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# An `async fn` that never awaits only hides that it's synchronous (CI runs clippy -D warnings).
unused_async = "warn"
# Every `#[allow]` or `#[expect]` says why.
allow_attributes_without_reason = "warn"
# No unexplained panics: outside tests, an `unwrap` or `expect` needs an
# `#[expect(clippy::..., reason = "...")]` (clippy.toml exempts tests).
unwrap_used = "deny"
expect_used = "deny"
# No lossy `as` (security.md §1 with overflow-checks): a conversion that can't hold is handled,
# or an `#[expect(..., reason)]` names the bound. Test code is exempt (each crate root).
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

# Exact versions are pinned in Cargo.lock (build-and-test.md §2).
[workspace.dependencies]
# internal
picket-wire = { path = "crates/picket-wire" }
picket-rules = { path = "crates/picket-rules" }
picket-bundle = { path = "crates/picket-bundle" }
picket-lookup = { path = "crates/picket-lookup" }
picket-api = { path = "crates/picket-api" }

# runtime / net
tokio = { version = "1.54", features = ["full"] }
socket2 = { version = "0.6", features = ["all"] }
quinn-udp = "0.6"
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
http = "1.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "json", "stream", "http2"] }
tokio-util = { version = "0.7.20", features = ["codec", "io", "rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
futures-util = { version = "0.3.34", features = ["sink"] }
bytes = "1.12"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["set-header", "compression-gzip", "decompression-gzip", "limit", "trace"] }

# TLS / crypto
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
aws-lc-rs = "1.19"
rustls-pki-types = { version = "1.16", features = ["std"] }
webpki-roots = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto", "x509-parser"] }
x509-parser = "0.18"
blake3 = "1.8"
sha1 = "0.11"
sha2 = "0.11"
minisign-verify = "0.3"
chacha20poly1305 = "0.11"
argon2 = "0.6"

# DNS
domain = { version = "0.13", default-features = false, features = ["std"] }
hickory-proto = { version = "0.26", features = ["dnssec-aws-lc-rs"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "dnssec-aws-lc-rs", "tls-aws-lc-rs", "https-aws-lc-rs"] }
hickory-net = { version = "0.26", features = ["dnssec-aws-lc-rs", "tls-aws-lc-rs", "https-aws-lc-rs"] }

# filtering data
fst = "0.4.7"
# xorf without its default `uniform-random` feature, which fills unused filter slots from thread_rng
# and so breaks byte-identical bundle builds (bundles.md §2 "Determinism")
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
regex-automata = "0.4.19"
regex = "1.13"
aho-corasick = "1.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
prefix-trie = "0.10"
idna = "1.1"
publicsuffix = "2.3"
ipnet = { version = "2.12", features = ["serde"] }

# caches / state
quick_cache = "0.7"
arc-swap = "1.9"

# storage
rusqlite = { version = "0.43", features = ["bundled", "blob", "functions", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# linux
netlink-sys = "0.9"
netlink-packet-core = "0.9"
netlink-packet-route = "0.34"
rtnetlink = "0.24"
notify = "9.0"
sd-notify = "0.5"
rustix = { version = "1.1", features = ["fs", "process", "system", "net"] }

# scheduling: cron schedules in UTC on croner's jiff backend (picket_lookup::cron keeps croner 4's
# reading, jiff plan choice D1)
croner = { version = "5.0", default-features = false, features = ["std", "jiff"] }
# SQS request signing for the `sqs` feed trigger (feed-scheduling.md §7; build-and-test.md §2:
# without the `sigv4a` feature); the credentials type its signing params take
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"

# API / UI glue
utoipa = { version = "6.0", features = ["axum_extras"] }
schemars = "1.2"
rust-embed = "8.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# helpers
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
# Timestamps (api.md §5), all UTC: no time-zone database (no tz features, nothing read from
# /usr/share/zoneinfo) and no serde feature, so every serialized timestamp names one of
# picket_api::time's adapters and keeps picket's stored forms (README §2 "Compatibility").
# ≥ 1.0.3: Timestamp::from_{milli,micro}second accept their whole range (jiff #723).
jiff = { version = "1.0.3", default-features = false, features = ["std", "perf-inline"] }
base64 = "0.23"
hex = "0.4"
rand = "0.10"
tar = { version = "0.4.46", default-features = false }
url = "2.5.9"
percent-encoding = "2.3"
memchr = "2.8"
smallvec = "1.16"

# dev
tempfile = "3.27"
minisign = "0.10"
# picket-wire allocation-budget tests (build-and-test.md §4): a counting global allocator
stats_alloc = "0.1.10"
# picket-core end-to-end tests run the real edge foundation against core (dev-dependency only)
picket-edge = { path = "apps/picket-edge" }
# picket-edge's firewall-client tests run the real helper engine in process (dev-dependency only)
picket-edge-helper = { path = "apps/picket-edge-helper" }
# picket-core's `/metrics` tests read the export with a Prometheus text parser (dev-dependency only,
# build-and-test.md §5 Metrics)
prometheus-scraper = { version = "0.2", default-features = false }


[profile.release]
panic = "unwind"
# As in tests and fuzzing: an overflow panics (one SERVFAIL or one failed job, contained by
# unwind) instead of wrapping into a wrong value.
overflow-checks = true
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
