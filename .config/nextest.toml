# cargo-nextest (CI runs `cargo nextest run --profile ci`). Each test runs in its own process, so
# the integration tests can share one binary without sharing state.

[profile.default]
# A test still running after 60 s is reported as slow; one still running after 5 minutes is
# killed and fails, rather than holding the job until its timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

# The bundle parity corpus is one long end-to-end test: about a minute on a CI runner, more on a
# loaded machine. It gets twice the limit; overrides in the default profile apply to every profile.
[[profile.default.overrides]]
filter = 'test(=bundles::parity_corpus_end_to_end)'
slow-timeout = { period = "120s", terminate-after = 5 }
