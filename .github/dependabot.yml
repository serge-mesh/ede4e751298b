version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    # The fuzz targets are independent workspaces with their own lockfiles.
    directories:
      - /
      - /fuzz/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /ui
      - /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /dist/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
