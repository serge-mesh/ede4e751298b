version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: 06:00
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz/*
    schedule:
      interval: daily
      time: 02:00
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - '*'
      cargo-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
  - package-ecosystem: npm
    directories:
      - /ui
      - /extension
    schedule:
      interval: daily
      time: 04:00
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
  - package-ecosystem: docker
    directory: /dist/docker
    schedule:
      interval: daily
      time: 08:00
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
