version: 2
# Version updates are weekly (Mondays, Australia/Sydney, staggered) and wait 3 days after a
# release before proposing it (Dependabot's default, written down here). Security updates are
# alert-driven and skip both the schedule and the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz/*
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - '*'
      cargo-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
  - package-ecosystem: npm
    directories:
      - /ui
      - /extension
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    ignore:
      # The TypeScript 7 compiler is already used for type-checking, through the
      # `typescript-native` alias. `typescript` itself stays on 5.x (ui) and 6.x (extension)
      # because it supplies the compiler API to typescript-eslint and openapi-typescript, and
      # TypeScript 7 has no such API. Lift this once both tools support TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /dist/docker
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
