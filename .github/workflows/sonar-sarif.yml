name: SonarQube Cloud SARIF sync

on:
  check_run:
    types: [completed]
  schedule:
    # Daily sync of the default branch so status changes made in SonarQube Cloud
    # (such as accepting an issue) propagate to GitHub Code Scanning without a new commit.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'SonarQube Cloud branch to sync (ignored when pull_request is set)'
        required: false
        default: 'main'
        type: string
      pull_request:
        description: 'Optional pull request number to sync instead of a branch'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - '.github/workflows/sonar-sarif.yml'
      - 'scripts/sonarcloud-to-sarif.py'
      - 'scripts/test_sonarcloud_to_sarif.py'

permissions:
  contents: read

concurrency:
  group: sonar-sarif-${{ github.event_name }}-${{ github.event.check_run.details_url || github.event.inputs.pull_request || github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test SonarQube Cloud SARIF exporter
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  sync:
    name: Sync SonarQube Cloud findings
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'check_run' ||
        (
          github.event.check_run.app.slug == 'sonarqubecloud' &&
          github.event.check_run.conclusion != 'cancelled' &&
          github.event.check_run.conclusion != 'stale'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Export SonarQube Cloud issues to SARIF
        id: export
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CHECK_RUN_DETAILS_URL: ${{ github.event.check_run.details_url }}
          CHECK_RUN_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_PULL_REQUEST: ${{ github.event.inputs.pull_request }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(
            --output "${RUNNER_TEMP}/sonarcloud.sarif"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ -n "${SONAR_PROJECT_KEY}" ]; then
            args+=(--project-key "${SONAR_PROJECT_KEY}")
          fi
          case "${EVENT_NAME}" in
            check_run)
              args+=(
                --check-run-url "${CHECK_RUN_DETAILS_URL}"
                --head-sha "${CHECK_RUN_HEAD_SHA}"
                --verify-sha
              )
              ;;
            workflow_dispatch)
              if [ -n "${INPUT_PULL_REQUEST}" ]; then
                args+=(--pull-request "${INPUT_PULL_REQUEST}")
              else
                args+=(
                  --branch "${INPUT_BRANCH:-${DEFAULT_BRANCH:-main}}"
                  --fallback-sha "${FALLBACK_SHA}"
                )
              fi
              ;;
            *)
              args+=(
                --branch "${DEFAULT_BRANCH:-main}"
                --fallback-sha "${FALLBACK_SHA}"
              )
              ;;
          esac
          python3 scripts/sonarcloud-to-sarif.py "${args[@]}"

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.export.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/sonarcloud.sarif
          category: sonarqube-cloud
          ref: ${{ steps.export.outputs.ref }}
          sha: ${{ steps.export.outputs.sha }}
