name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 23 4 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: CodeQL changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.codeql_rust }}
      js: ${{ steps.select.outputs.codeql_js }}
      actions: ${{ steps.select.outputs.codeql_actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test change routing
        run: python3 -m unittest discover -s scripts -p test_ci_changes.py

      - name: Select components and languages
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:rust

  analyze-js:
    name: Analyze (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript

  analyze-actions:
    name: Analyze (actions)
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:actions

  codeql:
    name: CodeQL
    needs:
      - changes
      - analyze-rust
      - analyze-js
      - analyze-actions
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      - name: Require selected CodeQL analyses
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.analyze-rust.result }}
          JS: ${{ needs.analyze-js.result }}
          ACTIONS: ${{ needs.analyze-actions.result }}
          WANTED_RUST: ${{ needs.changes.outputs.rust }}
          WANTED_JS: ${{ needs.changes.outputs.js }}
          WANTED_ACTIONS: ${{ needs.changes.outputs.actions }}
        run: |
          test "$CHANGES" = success
          for pair in "$WANTED_RUST:$RUST" "$WANTED_JS:$JS" "$WANTED_ACTIONS:$ACTIONS"; do
            case "$pair" in true:success|false:skipped|false:success) ;; *) exit 1 ;; esac
          done
