# cargo-fuzz targets for picket-core's untrusted input (README §2: every decoder of untrusted
# input is fuzzed). Run with `cargo +nightly fuzz run <target>` from this directory.
[package]
name = "picket-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
picket-core = { path = "../../apps/picket-core" }
serde_json = "1.0"
serde = "1.0"
tempfile = "3"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
picket-api = { path = "../../crates/picket-api" }
http = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt", "io-util", "time"] }
hickory-proto = { version = "0.26", features = ["dnssec-aws-lc-rs"] }
async-trait = "0.1"

# Its own workspace: fuzz/ is outside the main one.
[workspace]
members = ["."]

[[bin]]
name = "csr"
path = "fuzz_targets/csr.rs"
test = false
doc = false
bench = false

