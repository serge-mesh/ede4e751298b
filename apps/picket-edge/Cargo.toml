[package]
name = "picket-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "picket-edge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
picket-api.workspace = true
# the DNS data path (edge.md §4–§10): query checks, replies, upstream answers, cache values
picket-wire.workspace = true
# rule semantics types the bundle matcher returns (outcomes, rewrites, query context)
picket-rules.workspace = true
# bundle matching (bundles.md §6)
picket-bundle.workspace = true
# sync lookups (edge.md §10, providers.md §4)
picket-lookup.workspace = true
# decoding queries and answers is picket-wire's; the edge encodes `$dnsrewrite` HTTPS/SVCB values
hickory-proto.workspace = true
# listeners: SO_REUSEPORT per worker (socket2), IP_PKTINFO / IPV6_RECVPKTINFO (quinn-udp)
socket2.workspace = true
quinn-udp.workspace = true
# the DNS cache: S3-FIFO with a byte weigher (edge.md §8)
quick_cache.workspace = true
# client source ranges: longest-prefix match (edge.md §5)
prefix-trie.workspace = true
ipnet.workspace = true
# upstream trust store default: the Mozilla roots (edge.md §6)
webpki-roots.workspace = true
smallvec.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-tungstenite.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
blake3.workspace = true
flate2.workspace = true
arc-swap.workspace = true
rand.workspace = true
base64.workspace = true
url.workspace = true
rtnetlink.workspace = true
netlink-packet-route.workspace = true
sd-notify.workspace = true
# `param` adds clock_ticks_per_second() for /proc/<pid>/stat CPU times.
rustix = { workspace = true, features = ["param"] }
# the helper socket's length-delimited frames (edge-firewall.md §4)
tokio-util.workspace = true
# release signatures (edge.md §14)
minisign-verify.workspace = true

[dev-dependencies]
tempfile.workspace = true
# scripted lookup modules and mock clients for the pipeline tests
picket-lookup = { workspace = true, features = ["testkit"] }
# hot-path allocation checks (build-and-test.md §4): a counting global allocator
stats_alloc.workspace = true
# a signed test release for the update handoff (edge.md §14)
minisign.workspace = true
# the firewall client against the real helper engine in process (edge-firewall.md §4)
picket-edge-helper = { workspace = true, features = ["testkit"] }
# the golden timestamp tables of the chrono → jiff compatibility tests (README §2)
picket-api = { workspace = true, features = ["testkit"] }
